<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<title>Simple Drag&Drop using Generators</title>
		<link rel="stylesheet" href="styles.css">
	</head>

	<body>
		<div
			class="box"
			data-dnd="true"
		>
			Drag me!!!
		</div>

		<div
			class="box"
			data-dnd="true"
		>
			Drag me!!!
		</div>

		<div
			class="box"
			data-dnd="true"
		>
			Drag me!!!
		</div>

		<script type="module">
			import { dragAndDrop } from './script.js'

			for (const $el of document.querySelectorAll('*[data-dnd="true"]')) {
				dragAndDrop($el)
			}
		</script>
	</body>
</html>
